title: Про проєкт
lead: >-
  **Open Solana Hub** – це зрозумілі матеріали про Solana разом із відкритим [Validator Transparency](../compare/). Тут одночасно знайдуть щось для себе і новачки, які хочуть розібратися
  перед тим, як щось робити, і ті, хто вже делегує або працює з інфраструктурою.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>Як усе влаштовано</h2>
    <p>
    <strong>Навчальні сторінки</strong> пояснюють основи основ: блокчейн, гаманці, безпеку та стейкінг. 
    
    У розділі <strong>Оцінка валідаторів</strong> – це
    <a href="../compare/">Validator Transparency</a>:
    довгострокова стабільність на основі щоденних снепшотів мережі, історія комісій, голосування
    та розподіл стейку між пулами для кожного валідатора mainnet. Особисто я виходжу з того, що інформація 
    первинна, а вже потім можна заглиблюватися в дані, коли вони знадобляться. Стейкінг розглядається як можливість для заробітку, 
    але ми тут, щоб зрозуміти суть речей, а вже потім вирішувати, як взаємодіяти з екосистемою. Врешті-решт, принцип DYOR (Do Your Own Research) ніхто не скасовував.
    </p>
  
    <h2>Про творця проєкту</h2>
    <p>
    Мене звати <strong>Андрій</strong>, у спільноті Solana мене знають як <a href="https://andrewinua.com/" target="_blank" rel="noopener">AndrewInUA</a>.
    Я керую валідатором на mainnet і роблю відкриті інструменти для тих, хто делегує – не як класичний
    програміст, а як людина, якій важлива прозорість, зрозуміла мова і зв'язок між складними системами
    та звичайними користувачами.
    </p>
    <p>
    До Solana я працював у журналістиці та комунікаціях. У 2022 році приєднався до мережі та шукав
    інфраструктуру, якій можна довіряти. Hub – один із способів поділитися цим досвідом:
    спочатку пояснити, потім дати подивитися на дані, а рішення – за вами.
    </p>
  
    <h2>Інші проєкти</h2>
    <ul>
    <li><a href="./compare-validators.html">Як обрати і оцінити валідаторів</a> – про відкриті показники перед делегуванням</li>
    <li><a href="../compare/">Validator Transparency</a> – перегляд і оцінка будь-якого валідатора mainnet <span style="color:var(--text3);font-size:0.9em">(інтерфейс англійською)</span></li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-metrics-html-widget" target="_blank" rel="noopener">Validator Metrics Widget</a> – жива статистика на вашому сайті</li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-resources" target="_blank" rel="noopener">Ресурси для валідаторів Solana</a> – посібники та матеріали</li>
    <li><a href="https://andrewinua.com/" target="_blank" rel="noopener">andrewinua.com</a> – сторінка валідатора та делегування</li>
    </ul>
  
    <h2>Чого тут немає</h2>
    <p>
    Це не фінансова порада, не обіцянка прибутку і не заміна власній перевірці.
    Коли будете готові оцінювати валідаторів – дивіться відкриті показники; коли стейкаєте –
    гаманець і ключі лишаються у вас.
    </p>
  
