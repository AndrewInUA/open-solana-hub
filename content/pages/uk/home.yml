hero_title: Solana простими словами і зрозумілою мовою
hero_lead: >
  Пояснюємо Solana простими словами: що це за мережа, як працюють гаманці і коли в гру входить
  стейкінг. <a href="../compare/" target="_blank" rel="noopener noreferrer" data-new-tab="on">Validator Transparency</a> –
  крок перед стейком: стабільність, комісія та історія голосування кожного валідатора mainnet.
  <a href="../compare/mystake.html" target="_blank" rel="noopener noreferrer" data-new-tab="on">Stake health</a>
  далі стежить за стейком, який уже є. <a href="./news/">Новини Solana</a> – про оновлення протоколу,
  голосування, випуски клієнтів і спільноту.
