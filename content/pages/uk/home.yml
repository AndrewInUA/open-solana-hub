learn_title: Уся освіта про Solana – в одному місці
learn_intro: |-
  Шість посібників простою мовою, які доповнюють один одного – від першого гаманця
   до усвідомленого делегування. Поспішати нікуди: жодних тестів наприкінці.
dashboard_kicker: Відкриті дані
dashboard_title: Validator Transparency Dashboard
dashboard_body: |-
  Окремий відкритий інструмент для тих, хто вже делегує або збирається: стабільність,
   історія комісій, голосування та структура стейку кожного валідатора Solana mainnet –
   поруч, без маркетингу. Інтерфейс англійською.
