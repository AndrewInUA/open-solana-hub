hero_title: Solana простими словами і зрозумілою мовою
hero_lead: >
  Тут Solana пояснюють без складних термінів: що це за мережа, як працюють гаманці і коли варто
  стейкати SOL. Якщо ви вже делегуєте – відкрийте [Validator Transparency Dashboard](../compare/):
  стабільність, комісія та історія голосування кожного валідатора mainnet, без зайвого маркетингу.
