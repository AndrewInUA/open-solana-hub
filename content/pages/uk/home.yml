section_title: Що таке Solana?
section_body: >
  Solana – публічна мережа, через яку можна передавати й зберігати цифрову цінність напряму, без
  умовного банку-посередника. Уявіть спільну книгу обліку, яку бачить кожен: правила в ній не
  встановлює людина, їх виконує код. Тому **ви володієте своїми активами самі** – грошима,
  мистецтвом, квитками – а не орендуєте доступ у чужій системі.
