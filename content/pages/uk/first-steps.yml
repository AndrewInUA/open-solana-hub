title: Як стейкати SOL – перші практичні кроки
lead: >-
  Хочете розібратися, як і куди стейкати SOL на Solana? Ось чесний порядок дій: гаманець, дрібні
  тестові перекази, оцінка валідаторів – і делегування лише тоді, коли самі будете готові.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <ol class="step-list">
    <li>
    <strong>Поставте гаманець</strong><br />
    Візьміть надійний гаманець (Phantom, Solflare або Backpack) і завантажуйте його лише з офіційного сайту чи магазину застосунків.
    Seed-фразу випишіть на папір і тримайте поза інтернетом. Правила для seed-фрази – у розділі <a href="./stay-safe.html">безпека</a>.
    </li>
    <li>
    <strong>Закиньте трохи SOL</strong><br />
    Спершу заведіть мінімальну суму – рівно щоб відчути комісії та перекази. Це плата за навчання, а не інвестиція.
    </li>
    <li>
    <strong>Зробіть тестову транзакцію</strong><br />
    Перекиньте трохи SOL між своїми адресами або на другий свій гаманець і знайдіть її в оглядачі блокчейну.
    Так ви звикаєте до ритму: підписати → дочекатися підтвердження.
    </li>
    <li>
    <strong>Оцініть валідаторів до стейкінгу</strong><br />
    Стейкінг – це делегування валідатору, який голосує в мережі. Тут важить комісія, безперебійність і вся історія.
    Спершу гляньте, <a href="./compare-validators.html">як оцінювати валідаторів</a>, потім відкрийте
    <a href="../compare/index.html#directory-section">Validator Transparency Dashboard</a> <span style="color:var(--text3);font-size:0.9em">(інтерфейс англійською)</span>,
    знайдіть валідатора за назвою чи vote key і подивіться стабільність, комісію та зведення відносно всієї мережі.
    Спробуйте поставити два валідатори поруч.
    </li>
    <li>
    <strong>Стейкайте, лише коли готові</strong><br />
    У гаманці знайдіть валідатора за назвою або вставте його vote account.
    SOL лишається у вашому гаманці; вивести стейк (undelegate) можна будь-коли, але з періодом очікування.
    Ми не радимо конкретного валідатора – вивчайте, оцінюйте і вирішуйте самі.
    </li>
    </ol>
  
    <div class="callout">
    <strong>Спробуйте просто зараз</strong><br />
    <span style="color:var(--text2);font-size:14px">
    Відкрийте панель на готовому прикладі, а потім оберіть будь-якого валідатора з каталогу:
    </span>
    <div class="path-row" style="margin-top:12px">
    <a class="btn btn-primary" href="../compare/index.html?vote=3QPGLackJy5LKctYYoPGmA4P8ncyE197jdxr1zP2ho8K">Приклад валідатора</a>
    <a class="btn btn-ghost" href="../compare/index.html#directory-section">Каталог валідаторів</a>
    </div>
    </div>
  
    <h2>На що дивитися на панелі</h2>
    <ul>
    <li><strong>Комісія</strong> – частка валідатора з ваших винагород; зазвичай менша краща для вас (комісія пулу може додаватися окремо).</li>
    <li><strong>Оцінка стабільності</strong> – довгострокова надійність на основі збережених снепшотів.</li>
    <li><strong>Поточний статус</strong> – валідатор працює чи випав із голосування прямо зараз.</li>
    <li><strong>Звідки стейк</strong> – скільки приходить через відомі пули (дані Trillium).</li>
    </ul>
  
    <h2>Часті запитання</h2>
    <h3>Як стейкати SOL новачку?</h3>
    <p>
    Поставте гаманець, закиньте трохи SOL, зробіть тестову транзакцію,
    <a href="./compare-validators.html">оцініть валідаторів</a> за відкритими показниками і делегуйте з
    гаманця, коли будете готові. SOL увесь час лишається у вас.
    </p>
    <h3>Стейкати SOL безпечно?</h3>
    <p>
    У нативному стейкінгу SOL лишається у вашому гаманці – ви делегуєте, а не віддаєте монети.
    Головні ризики – слабкий валідатор і шахраї. Тому спершу <a href="./stay-safe.html">безпека</a> і оцінку, а потім вибір.
    </p>
    <h3>Чи можна потім вивести стейк?</h3>
    <p>
    Так. Зняти делегування можна будь-коли, але є період очікування – приблизно одна епоха, поки SOL знову стане
    повністю вільним. Гаманець і ключі весь цей час у вас.
    </p>
    <h3>Скільки SOL потрібно, щоб почати стейкати?</h3>
    <p>
    Суттєвого мінімуму немає – делегувати можна навіть частку SOL. Залиште трохи вільних монет на комісії
    і починайте з суми, з якою комфортно вчитися. «Епоха» чи «vote account» звучать загадково?
    У <a href="./glossary.html">словнику</a> кожен термін пояснено одним реченням.
    </p>
