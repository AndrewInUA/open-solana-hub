body: |
  <h2>Seed-фраза – головний ключ до всього</h2>
    <ul>
    <li>Ніколи не вводьте її на сайтах, у Telegram-ботах чи у формах «підтримки».</li>
    <li>Не фотографуйте і не зберігайте її в хмарних нотатках чи месенджерах.</li>
    <li>Чесний застосунок <em>ніколи</em> не попросить вставити seed-фразу, щоб «підтвердити» чи «синхронізувати» гаманець.</li>
    <li>Хто має вашу seed-фразу – той має ваші гроші. Відновити вкрадене зазвичай неможливо.</li>
    </ul>
  
    <h2>Як вас намагатимуться обдурити</h2>
    <ul>
    <li><strong>«Дармовий» SOL чи NFT в особисті</strong> – класичний хід у Discord, X і Telegram.</li>
    <li><strong>Фальшива підтримка</strong> – «помітили підозрілу активність, під'єднайте гаманець ось тут».</li>
    <li><strong>Надто солодкий APY</strong> – гарантований великий дохід це тривожний дзвіночок. Реальна дохідність стейкінгу плаває і має ризики.</li>
    <li><strong>Тиск і поспіх</strong> – «встигни за 10 хвилин, бо втратиш доступ». Нормальні інструменти так не тиснуть.</li>
    <li><strong>Незнайомі застосунки</strong> – читайте, що підписуєте. Одна шкідлива транзакція може вивести дозволені токени.</li>
    <li><strong>Фейкові вакансії та баунті</strong> – особисті з «оплачуваним гігом» чи завданням за ейрдроп, де просять під'єднати гаманець або вставити seed-фразу. Справжні лістинги живуть на сайтах, які ви відкрили самі (для Solana це часто <a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a>).</li>
    </ul>
  
    <div class="callout callout-warn">
    <strong>Просте правило</strong><br />
    Не ви шукали це посилання – ставтеся до нього як до ворожого. Офіційні сайти відкривайте вручну за адресою або з перевірених закладок.
    </div>
  
    <h2>Спершу перевірте, потім довіряйте</h2>
    <ul>
    <li>Звіряйте назви валідаторів і проєктів за кількома джерелами, а не за одним красивим сайтом.</li>
    <li>Перевіряйте адреси в оглядачах блокчейну (Solscan, Solana Beach), а не лише на гарній вітрині сайту.</li>
    <li>Оцінюйте валідаторів відкритими інструментами – <a href="../compare/">Validator Transparency</a> <span style="color:var(--text3);font-size:0.9em">(інтерфейс англійською)</span> або нашим <a href="./compare-validators.html">посібником з оцінки</a> – ще до делегування.</li>
    </ul>
  
    <h2>Якщо щось уже пішло не так</h2>
    <p>
    Помиляються і обережні люди. Головне – наступні десять хвилин:
    </p>
    <ul>
    <li><strong>Сказали комусь seed-фразу?</strong> Негайно створіть новий гаманець із новою фразою і переведіть усе, що встигнете. Старий гаманець скомпрометований назавжди – ту фразу більше не використовуйте.</li>
    <li><strong>Підписали щось підозріле?</strong> Переведіть залишок на свіжий гаманець, а потім перегляньте й відкличте дозволи на токени перевіреним інструментом, перш ніж повертатися до старої адреси.</li>
    <li><strong>Переказали кошти шахраю?</strong> Перекази в блокчейні остаточні – жодна «підтримка» їх не поверне. Зафіксуйте, що сталося, попередьте спільноту, де це трапилось, і вважайте це платою за науку.</li>
    <li><strong>Прилетіли дивні токени чи NFT?</strong> Просто не чіпайте їх. Багато крадіжок починаються саме зі взаємодії з невідомим airdrop – ігнорувати його нічого не коштує.</li>
    </ul>
  
    <h2>Часті запитання</h2>
    <h3>Що робити, якщо я комусь сказав seed-фразу?</h3>
    <p>
    Створіть новий гаманець із новою фразою і переведіть усе, що встигнете – скомпрометований гаманець
    можуть спустошити будь-якої миті. Стару фразу не використовуйте ніде, навіть «тимчасово».
    </p>
    <h3>Як розпізнати шахрайство в Solana?</h3>
    <p>
    Несподіваний «безплатний» SOL, «підтримка», що просить підтвердити гаманець, гарантований APY,
    таймери зворотного відліку. Чесні інструменти не просять seed-фразу і нікуди не женуть.
    </p>
    <h3>Чи безпечно під'єднувати гаманець до сайту?</h3>
    <p>
    Саме під'єднання зазвичай безпечне – небезпека в тому, що ви <em>підписуєте</em> далі.
    Під'єднуйтеся лише до сайтів, які знайшли самі, читайте кожну транзакцію
    і тримайте окремий гаманець із малими сумами для експериментів.
    </p>
  
    <h2>Чого ми тут ніколи не робимо</h2>
    <p>
    Не просимо ваші ключі, не обіцяємо дохід і не підганяємо стейкати сьогодні.
    Спершу розібратися – а діяти чи ні, вирішуєте тільки ви. Перечепилися об незнайоме слово?
    У <a href="./glossary.html">словнику Solana</a> кожен термін пояснено одним реченням.
    </p>
