title: Безпека в Solana
lead: >-
  Більшість втрат у крипто – це не «зламаний блокчейн», а банальний обман людини. Тому тут варто
  пригальмувати – воно того варте. Якщо ви тільки заходите в Solana, спершу гляньте
  [основи](./basics.html).
