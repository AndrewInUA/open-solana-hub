title: Як обрати і оцінити валідаторів Solana
lead: >-
  Делегувати SOL – це насамперед вибір, кому довіряти. Цей посібник показує, як обрати валідатора:
  на що дивитися, крім гучного APY, і як [Validator Transparency](../compare/) допомагає
  оцінити будь-якого валідатора mainnet за відкритими даними.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>Чому APY – це ще не все</h2>
    <p>
    Дохідність плаває разом зі станом мережі. Валідатор може підняти <strong>комісію</strong> (свою частку з ваших винагород),
    пропускати голоси під навантаженням або сьогодні виглядати ідеально, маючи при цьому слабку довгу історію.
    Якщо сортувати лише за APY, ви женетеся за цифрою, а не за поведінкою в часі.
    </p>
    <p>
    Тільки заходите в Solana? Спершу гляньте <a href="./basics.html">пояснення Solana та SOL</a> і
    <a href="./stay-safe.html">безпеку</a>, перш ніж делегувати щось відчутне.
    </p>
  
    <h2>Показники, які реально про прозорість</h2>
    <ul>
    <li><strong>Комісія</strong> – поточна і як вона мінялася раніше. Стрибок до 100% може з'їсти всі ваші винагороди.</li>
    <li><strong>Оцінка стабільності</strong> – довгострокова надійність на основі щоденних снепшотів усієї мережі.</li>
    <li><strong>Статус голосування</strong> – валідатор працює прямо зараз чи випав із голосування.</li>
    <li><strong>Звідки стейк</strong> – скільки приходить через відомі пули, а скільки прямими делегаціями з гаманців (дані Trillium).</li>
    <li><strong>APY як контекст</strong> – корисний поруч із комісією та стабільністю, але не як єдиний фільтр.</li>
    </ul>
  
    <h2>Три способи користуватися Validator Transparency</h2>
    <ol>
    <li><strong>Каталог</strong> – пошук за назвою чи vote key, сортування за стейком, перехід у профіль валідатора.</li>
    <li><strong>Профіль валідатора</strong> – стабільність, історія комісій, голосування по епохах і позначки пулів на одній сторінці.</li>
    <li><strong>Двоє поруч</strong> – вбудоване порівняння, коли короткий список уже зібрано.</li>
    </ol>
  
    <h2>Простий порядок дій</h2>
    <ol>
    <li>Якщо ще немає гаманця чи тестового переказу – почніть із <a href="./first-steps.html">перших практичних кроків</a>.</li>
    <li>Відкрийте <a href="../compare/index.html#directory-section">каталог валідаторів</a> <span style="color:var(--text3);font-size:0.9em">(інтерфейс англійською)</span> і виберіть кілька знайомих назв – або шукайте за vote key.</li>
    <li>Перевірте комісію та стабільність кожного; занотуйте все, що виглядає непослідовно.</li>
    <li>Якщо двоє йдуть ніздря в ніздрю – поставте їх поруч на тій самій сторінці.</li>
    <li>Делегуйте лише коли впевнені – ми не радимо конкретного валідатора.</li>
    </ol>
  
    <h2>Часті запитання</h2>
    <h3>Як обрати валідатора Solana?</h3>
    <p>
    Дивіться на комісію та її історію, довгострокову стабільність, статус голосування і звідки йде стейк –
    а не лише на APY. Оцініть короткий список за одними показниками і делегуйте з гаманця, коли будете впевнені.
    </p>
    <h3>Що перевірити перед делегуванням?</h3>
    <p>
    Комісію (поточну та історію), довгострокову стабільність, статус голосування і частку стейку з відомих пулів
    проти прямих делегацій. Самого APY замало.
    </p>
    <h3>Чим Validator Transparency кращий за сайти з APY?</h3>
    <p>
    Він про прозорість: довгострокова стабільність зі щоденних снепшотів, ризик комісії, стабільність голосування
    і звідки стейк – а не одна гучна цифра дохідності.
    </p>
    <h3>Чи можна поставити два валідатори поруч?</h3>
    <p>
    Так. На <a href="../compare/">Validator Transparency</a> <span style="color:var(--text3);font-size:0.9em">(інтерфейс англійською)</span> відкрийте будь-який валідатор і вбудованим
    порівнянням поставте поруч другий – на тих самих показниках.
    </p>
  
    <blockquote>
    Навчальні сторінки пояснюють, <em>навіщо</em> існує стейкінг; Validator Transparency дає <em>відкриті дані</em>, щоб оцінити ще до дії.
    Ширший огляд пулів і винагород – в <a href="./ecosystem.html">огляді стейкінгу та екосистеми</a>.
    </blockquote>
