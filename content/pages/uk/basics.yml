body: |
  <h2>Блокчейн в одному абзаці</h2>
    <p>
    Блокчейн – це спільна книга обліку, копія якої лежить одразу на тисячах комп'ютерів. Нею не володіє жодна компанія,
    а кожен охочий може перевірити правила. Зміни вносяться лише за згодою мережі. Solana – одна з таких мереж,
    створена для швидких і дешевих транзакцій навіть під великим навантаженням.
    </p>
  
    <h2>Що таке SOL?</h2>
    <p>
    SOL – це монета Solana. Нею платять невеликі комісії за транзакції і, за бажанням, стейкають.
    Просто тримати SOL – це ще не дохід: стейкінг окремий і добровільний крок.
    Коли будете готові, гляньте <a href="./first-steps.html">перші практичні кроки</a>.
    </p>
  
    <h2>Що таке гаманець?</h2>
    <p>
    Гаманець – це програма (або окремий пристрій), яка зберігає ваші ключі – секретні коди, що підтверджують:
    адреса в Solana ваша. Популярні варіанти – Phantom, Solflare, Backpack. Гаманець показує баланс і дає підписувати транзакції.
    Перш ніж тримати там відчутні суми, прочитайте <a href="./stay-safe.html">про безпеку</a>.
    </p>
    <ul>
    <li><strong>Ваші ключі – ваш контроль.</strong> Втратите seed-фразу – ніхто її не «відновить», як у банку. Тут банку немає.</li>
    <li><strong>Транзакції публічні.</strong> Суми й адреси видно в експлорерах. Приватність працює інакше, ніж на банківському рахунку.</li>
    <li><strong>Починайте з малого.</strong> Спершу спробуйте дрібну суму, а вже потім переказуйте щось серйозне.</li>
    </ul>
  
    <h2>Чим Solana відрізняється від Bitcoin та Ethereum?</h2>
    <p>
    Це радше три різні інструменти, ніж три учасники одного забігу. Bitcoin задуманий як цифрові гроші –
    обмежені, навмисно повільні, майже незмінні. Ethereum першим показав, що мережа може виконувати програми,
    а не лише переказувати монети – так з'явилися смартконтракти. Solana бере цю ідею і доводить до швидкості
    й дешевизни: підтвердження за секунди, комісія – частка цента. Саме тому щоденні дії – платежі, дрібні
    перекази, часте користування застосунками – тут практика, а не теорія.
    </p>
  
    <h2>Web3 – про що це взагалі</h2>
    <p>
    «Web3» – це коротко про застосунки та активи, які живуть у публічних мережах на кшталт Solana, а не в базі даних однієї компанії.
    Ви під'єднуєте гаманець замість того, щоб заводити ще один логін і пароль. Галас довкола цього – справа смаку, а от сама технологія цілком реальна.
    Трапилося незнайоме слово? У <a href="./glossary.html">словнику Solana</a> кожен термін пояснено одним реченням.
    </p>
  
    <h2>Часті запитання</h2>
    <h3>Що таке Solana простими словами?</h3>
    <p>
    Це публічний блокчейн – спільна книга обліку на тисячах комп'ютерів, яку не контролює жодна компанія.
    Мережа створена для швидких і дешевих транзакцій. SOL – її монета.
    </p>
    <h3>Для чого потрібен SOL?</h3>
    <p>
    Ним платять невеликі комісії в мережі, і його можна стейкати, щоб допомагати захищати мережу й отримувати частку винагород.
    Просто тримати SOL винагороди не дає – <a href="./first-steps.html">стейкінг</a> це окремий, добровільний крок.
    </p>
    <h3>Що таке гаманець Solana?</h3>
    <p>
    Гаманець зберігає ваші ключі – секретні коди, що підтверджують контроль над адресою. Популярні варіанти – Phantom,
    Solflare, Backpack. Seed-фраза тут головний ключ; перш ніж тримати відчутні суми, прочитайте <a href="./stay-safe.html">про безпеку</a>.
    </p>
    <h3>Чим Solana відрізняється від Bitcoin та Ethereum?</h3>
    <p>
    Bitcoin – цифрові гроші з обмеженою емісією; Ethereum перший запровадив смартконтракти; Solana оптимізує
    обидві ідеї у швидкість і дешевизну – секунди на підтвердження, частка цента за транзакцію.
    Різні інструменти для різних задач.
    </p>
  
    <blockquote>
    Спершу розібратися, потім заробляти. Розберіться з гаманцями та комісіями ще до того, як стейкати чи лізти в DeFi.
    Плануєте делегувати? Спершу гляньте, <a href="./compare-validators.html">як оцінювати валідаторів</a>.
    </blockquote>
