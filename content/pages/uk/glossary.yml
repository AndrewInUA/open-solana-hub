title: Словник Solana – терміни простими словами
lead: >-
  У кожній сфері є свій діалект, крипта просто говорить ним голосніше. Тут зібрано слова, які ви
  реально зустрінете в Solana – по одному зрозумілому реченню на кожне, без лекцій. Збережіть у
  закладки й повертайтеся щоразу, коли посібник чи гаманець скаже щось дивне.
