body: |
  <h2>Основи</h2>
    <ul>
    <li><strong>Блокчейн</strong> – спільна книга обліку, копія якої лежить на тисячах комп'ютерів; нею не володіє жодна компанія, а правила може перевірити кожен.</li>
    <li><strong>Solana</strong> – публічний блокчейн, створений для швидких і дешевих транзакцій; саме про цю мережу всі наші матеріали.</li>
    <li><strong>SOL</strong> – рідна монета Solana: нею платять комісії мережі, і її можна за бажанням стейкати.</li>
    <li><strong>Lamport</strong> – найменша одиниця SOL, як копійка до гривні; 1 SOL = 1&nbsp;мільярд лампортів.</li>
    <li><strong>Транзакція</strong> – будь-яка дія, записана в мережі: переказ, обмін, делегування стейку.</li>
    <li><strong>Комісія мережі</strong> – невелика плата в SOL за транзакцію; у Solana зазвичай частка цента.</li>
    <li><strong>Адреса</strong> – ваш публічний «номер рахунку» в Solana; нею можна ділитися, на відміну від ключів.</li>
    <li><strong>Оглядач блокчейну</strong> – публічний сайт (Solscan, Solana FM), де будь-хто може переглянути транзакції, адреси та валідаторів.</li>
    <li><strong>Епоха</strong> – календарна одиниця Solana, приблизно 2–3 дні; зміни стейкінгу та винагороди відбуваються на межі епох.</li>
    <li><strong>Mainnet</strong> – справжня мережа зі справжньою цінністю, на відміну від тестових мереж для практики.</li>
    <li><strong>Devnet / testnet</strong> – тренувальні мережі, де монети нічого не варті; тут розробники й допитливі безпечно ламають речі.</li>
    </ul>
  
    <h2>Гаманці та безпека</h2>
    <ul>
    <li><strong>Гаманець</strong> – програма або пристрій, що зберігає ваші ключі й дає підписувати транзакції; у Solana популярні Phantom, Solflare та Backpack.</li>
    <li><strong>Seed-фраза</strong> – 12–24 слова, які відновлюють гаманець; хто їх знає – той назавжди контролює ваші кошти, без апеляцій.</li>
    <li><strong>Приватний ключ</strong> – секретний код, яким підписуються ваші транзакції; seed-фраза може його відтворити, тому обидва мають лишатися в таємниці.</li>
    <li><strong>Публічний ключ</strong> – відкрита половина пари; з нього утворюється ваша адреса.</li>
    <li><strong>Апаратний гаманець</strong> – фізичний пристрій (Ledger та подібні), що тримає ключі поза інтернетом; надійний захист для відчутних сум.</li>
    <li><strong>Підписання</strong> – схвалення транзакції вашим ключем; читайте, що підписуєте, бо підпис – це згода.</li>
    <li><strong>Фішинг</strong> – фальшиві сайти, повідомлення чи «підтримка», що виманюють ключі або підпис під шкідливою транзакцією.</li>
    <li><strong>Дрейнер</strong> – шкідлива транзакція чи застосунок, що спустошує гаманець після вашого схвалення; саме тому «читай, що підписуєш» – правило номер один.</li>
    <li><strong>Самозберігання</strong> – ви тримаєте власні ключі замість довіряти біржі; більше свободи – більше відповідальності.</li>
    </ul>
  
    <h2>Стейкінг і валідатори</h2>
    <ul>
    <li><strong>Стейкінг</strong> – блокування SOL на підтримку безпеки мережі за частку винагород; у Solana це добровільно і зворотно.</li>
    <li><strong>Делегування</strong> – ви спрямовуєте свій стейк на обраного валідатора; SOL при цьому не покидає ваш гаманець.</li>
    <li><strong>Валідатор</strong> – оператор серверів, які підтверджують транзакції та голосують за стан мережі; стейкаючи, ви обираєте, кого підтримати.</li>
    <li><strong>Vote account</strong> – публічна ідентичність валідатора для голосування й делегувань; той довгий ключ, за яким його можна знайти в Validator Transparency.</li>
    <li><strong>Комісія валідатора</strong> – відсоток винагород, який валідатор залишає собі за роботу інфраструктури; дивіться на історію, а не лише на сьогоднішнє число.</li>
    <li><strong>Stake account</strong> – рахунок у мережі, де лежить ваш делегований SOL; гаманець створює його автоматично під час стейкінгу.</li>
    <li><strong>Виведення стейку</strong> – вихід зі стейкінгу: ви подаєте запит і чекаєте до кінця епохи, поки SOL знову стане ліквідним.</li>
    <li><strong>Винагороди</strong> – додатковий SOL за стейкінг, нараховується щоепохи; сума плаває разом із мережею, тож до фіксованих обіцянок ставтеся з підозрою.</li>
    <li><strong>APY</strong> – орієнтовна річна дохідність; корисна як контекст і оманлива як єдиний фільтр для вибору валідатора.</li>
    <li><strong>Інфляція</strong> – планова емісія нового SOL, з якої фінансуються винагороди; за задумом вона поступово знижується.</li>
    <li><strong>Delinquent</strong> – валідатор, який припинив голосувати; делегування такому не приносить нічого, поки він не відновиться.</li>
    <li><strong>Нативний стейкінг</strong> – делегування з власного гаманця обраному валідатору; максимум контролю, і саме про це більшість матеріалів Хабу.</li>
    <li><strong>Ліквідний стейкінг</strong> – ви вносите SOL у пул, який стейкає за вас і видає ліквідний токен; зручно, але додає комісію пулу та ризик смартконтракту.</li>
    <li><strong>Стейк-пул</strong> – сервіс (Marinade, Jito та інші), що розподіляє внесений SOL між багатьма валідаторами.</li>
    <li><strong>LST</strong> – «liquid staking token» (mSOL, JitoSOL) – токен-розписка від пулу, яким можна торгувати, поки базовий SOL застейканий.</li>
    <li><strong>MEV</strong> – «maximal extractable value» – додатковий дохід валідаторів від упорядкування транзакцій; у Solana часто через Jito. Варто знати, не варто боятися.</li>
    </ul>
  
    <h2>Екосистема та сленг</h2>
    <ul>
    <li><strong>dApp</strong> – «децентралізований застосунок» – працює поверх блокчейну і під'єднується до гаманця замість логіна з паролем.</li>
    <li><strong>DeFi</strong> – фінансові застосунки (обміни, кредитування) в публічних мережах; потужна річ, де варто ходити повільно.</li>
    <li><strong>NFT</strong> – унікальний запис у блокчейні: мистецтво, членства, ігрові предмети; володіння перевіряється, цінність не гарантується.</li>
    <li><strong>Токен</strong> – будь-який актив у мережі, крім самого SOL; частина корисна, частина – жарти, і мало що з цього інвестиція.</li>
    <li><strong>Airdrop</strong> – безплатні токени на гаманець: іноді маркетинг, часто приманка шахраїв; несподівані токени краще не чіпати.</li>
    <li><strong>Баунті</strong> – оплачуване завдання від проєкту (текст, дизайн, код); головна Solana-дошка – Superteam Earn. Платять за здану роботу, не як за стейкінг.</li>
    <li><strong>RPC</strong> – точка з'єднання, через яку застосунки говорять із мережею; коли гаманець «не під'єднується», це зазвичай збій RPC, а не втрачені кошти.</li>
    <li><strong>DYOR</strong> – «do your own research», перевіряй самостійно – головне правило всього цього сайту.</li>
    </ul>
  
    <h2>Часті запитання</h2>
    <h3>Що таке епоха в Solana?</h3>
    <p>
    Епоха – це внутрішній календар Solana, приблизно 2–3 дні. Зміни стейкінгу – делегування, виведення,
    оновлення комісії – набувають чинності на межі епох, а винагороди нараховуються раз на епоху.
    </p>
    <h3>Що таке комісія валідатора?</h3>
    <p>
    Відсоток, який валідатор залишає собі з винагород за стейкінг. Комісія 5% означає, що 95% винагород
    дістаються тим, хто делегував. Історія комісії важить більше за сьогоднішнє число – чому саме,
    пояснює <a href="./compare-validators.html">посібник з оцінки валідаторів</a>.
    </p>
    <h3>Чим нативний стейкінг відрізняється від ліквідного?</h3>
    <p>
    Нативний: ви делегуєте з власного гаманця обраному валідатору, і SOL лишається під вашим контролем.
    Ліквідний: ви вносите SOL у пул, він розподіляє стейк між валідаторами, а вам видає ліквідний токен
    (mSOL, JitoSOL). Докладніше – в <a href="./ecosystem.html">огляді екосистеми</a>.
    </p>
  
    <blockquote>
    Термін, який ніяк не запам'ятовується – це не провал, а привід для закладки.
    Коли будете готові вживати ці слова на практиці, починайте з <a href="./basics.html">основ</a>
    або одразу з <a href="./first-steps.html">перших практичних кроків</a>.
    </blockquote>
