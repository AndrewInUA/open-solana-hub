body: |
  <h2>Що тут можна робити</h2>
    <p>
    Solana – це не лише стейкінг. Більшість людей починає з одного з цих шляхів – оберіть той, заради якого ви зайшли:
    </p>
    <ul>
    <li><strong><a href="#earn">Заробити роботою</a></strong> – тексти, дизайн, переклад, спільнота чи код. Оплачувані завдання від проєктів Solana, не дохідність стейкінгу.</li>
    <li><strong><a href="#stake">Стейкати SOL</a></strong> – делегувати валідатору і ділити мережеві винагороди. Необов'язково, оборотно, і саме це цей Hub розкриває найглибше.</li>
    <li><strong><a href="#apps">Користуватися застосунками й токенами</a></strong> – платежі, ринки, NFT. Достатньо гаманця; не все з цього інвестиція.</li>
    </ul>
  
    <h2 id="earn">Як заробити не лише стейкінгом</h2>
    <p>
    Якщо ви тільки заходите, перше питання часто таке: як заробити. Стейкінг – одна відповідь;
    оплачувана робота – інша. Велика частина Solana – це люди, які пишуть тексти, роблять дизайн,
    перекладають, ведуть спільноту чи пишуть код для проєктів. Щоб долучитися, не обов'язково бути розробником.
    </p>
    <p>
    <a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a> – головна
    Solana-дошка таких завдань: баунті, фриланс і гранти від проєктів екосистеми. Ви створюєте профіль,
    обираєте лістинг, здаєте роботу й отримуєте оплату в крипті, якщо спонсор її приймає. Це дошка
    вакансій, а не дохідність стейкінгу і не обіцяний заробіток.
    </p>
    <ul>
    <li><strong>Що це</strong> – відкриті завдання від команд Solana; платять криптою, коли роботу прийнято.</li>
    <li><strong>Для кого</strong> – автори, дизайнери, перекладачі, люди зі спільноти й розробники. Багато завдань без коду.</li>
    <li><strong>Чим це не є</strong> – пасивна дохідність, фарм ейрдропів чи спосіб обійти навчання гаманцю й безпеці.</li>
    </ul>
    <p>
    Збережіть офіційну адресу в закладки самі. Фейкові «баунті» чи «оплачувані гіги» в особисті – типова
    схема. Відкривайте лістинги, які знайшли самі, читайте, що підписуєте, і дотримуйтесь правил з
    <a href="./stay-safe.html">розділу про безпеку</a>.
    </p>
  
    <h2 id="apps">Застосунки та токени</h2>
    <p>
    На Solana живуть тисячі застосунків – платежі, ігри, торгові майданчики, DeFi. Майже всім потрібне під'єднання гаманця.
    Токени – це активи в мережі: за одними стоять проєкти, інші це меми, ще інші справді корисні. Не все з цього варто вважати інвестицією.
    </p>
  
    <h2>NFT та цифрове володіння</h2>
    <p>
    NFT – унікальні записи в блокчейні: мистецтво, членства, ігрові предмети. Володіння легко перевірити,
    а от цінність задає спільнота й ринок – ніхто її не гарантує.
    </p>
  
    <h2 id="stake">Де стейкати SOL</h2>
    <p>
    По суті є два шляхи: <strong>нативне делегування</strong> з гаманця, коли валідатора обираєте ви,
    або <strong>ліквідний стейкінг-пул</strong>, коли валідаторів за вас підбирає пул.
    У будь-якому разі спершу гляньте на комісію та історію – наш
    <a href="./compare-validators.html">посібник з оцінки валідаторів</a> і
    <a href="./first-steps.html">інструкція зі стейкінгу SOL</a> проведуть крок за кроком.
    </p>
  
    <h2>Валідатори та стейкінг</h2>
    <p>
    Валідатори тримають вузли, які допомагають мережі домовлятися про транзакції. Коли ви стейкаєте, то делегуєте SOL валідатору,
    якому довіряєте: він заробляє на голосуванні, а ви отримуєте частку інфляційних винагород за вирахуванням його комісії.
    </p>
    <ul>
    <li><strong>Нативний стейкінг</strong> – пряме делегування з гаманця на вибраний вами валідатор.</li>
    <li><strong>Ліквідний стейкінг і пули</strong> – стейк через пул (Marinade, Jito тощо); валідаторів добирає пул.</li>
    <li><strong>Спершу оцініть</strong> – відкрийте <a href="../compare/">Validator Transparency Dashboard</a> або прочитайте, <a href="./compare-validators.html">як оцінювати валідаторів</a>.</li>
    </ul>
  
    <h2>Як працюють винагороди (без перебільшень)</h2>
    <p>
    Стейкінг може давати частку інфляційних винагород мережі мінус комісія валідатора (а якщо через пул – ще й комісія пулу).
    Дохідність плаває разом зі станом мережі – жодна чесна людина не пообіцяє вам фіксованої ставки «заробітку на Solana».
    Винагороди не гарантовані, і <a href="./stay-safe.html">розуміти ризики</a> важливіше, ніж ганятися за відсотками.
    </p>
  
    <h2>Нативний чи ліквідний стейкінг – коротке порівняння</h2>
    <ul>
    <li><strong>Контроль</strong> – нативний: валідатора обираєте ви; ліквідний: за вас обирає пул.</li>
    <li><strong>Зберігання</strong> – нативний: SOL лежить у вашому stake-акаунті; ліквідний: SOL у смартконтракті пулу, а у вас токен-розписка (mSOL, JitoSOL).</li>
    <li><strong>Ліквідність</strong> – нативний: виведення чекає до кінця епохи; ліквідний: токен можна продати одразу.</li>
    <li><strong>Комісії</strong> – нативний: лише комісія валідатора; ліквідний: комісія валідаторів плюс комісія самого пулу.</li>
    <li><strong>Додатковий ризик</strong> – нативний: невдалий вибір валідатора; ліквідний: смартконтракт і ринкова ціна токена.</li>
    </ul>
    <p>
    Жоден варіант не «кращий» – вони про різні потреби. Хочете розібратись і вибрати самі –
    йдіть у нативний і спершу <a href="./compare-validators.html">оцініть валідаторів</a>.
    Хочете «поставив і забув» – надійний пул буде чесним компромісом.
    </p>
  
    <h2>Часті запитання</h2>
    <h3>Чи можна заробити SOL, не будучи розробником?</h3>
    <p>
    Так, якщо йдеться про оплачувану роботу, а не про стейкінг. На Superteam Earn є тексти, дизайн,
    переклад та інші завдання від проєктів Solana. Платять за здану роботу, не як за дохідність, і
    все одно потрібен гаманець – дотримуйтесь правил з <a href="./stay-safe.html">розділу про безпеку</a>.
    </p>
    <h3>Де найкраще стейкати SOL?</h3>
    <p>
    Єдиного «найкращого» місця немає – усе залежить від того, скільки контролю ви хочете.
    Нативне делегування дає повний вибір і контроль; ліквідні пули зручніші, але додають комісії
    та ризик смартконтракту. У будь-якому разі спершу дивіться на відкриті дані – саме для цього
    існує <a href="../compare/">панель прозорості</a>.
    </p>
    <h3>Чи можу я втратити SOL, якщо валідатор зламається?</h3>
    <p>
    У нативному стейкінгу валідатор, що впав, коштує вам недоотриманих винагород, а не основної суми –
    slashing делегованого стейку в Solana наразі відсутній. Справжні небезпеки –
    <a href="./stay-safe.html">шахрайства та власні ключі</a>, а не простій валідатора.
    </p>
    <h3>Що таке ліквідний стейкінг у Solana?</h3>
    <p>
    Ви вносите SOL у пул, він розподіляє стейк між багатьма валідаторами, а вам видає ліквідний токен
    (mSOL, JitoSOL). Ліквідність одразу, а ціна за неї – комісія пулу і ризик смартконтракту.
    Незнайоме слово? Загляньте у <a href="./glossary.html">словник</a>.
    </p>
  
    <h2>Де копнути глибше (офіційні джерела)</h2>
    <ul>
    <li><a href="https://solana.com/docs" target="_blank" rel="noopener">Документація Solana</a></li>
    <li><a href="https://solana.com/docs/intro/quick-start" target="_blank" rel="noopener">Швидкий старт Solana (Playground)</a></li>
    <li><a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a> – баунті та гіги від проєктів Solana</li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-resources" target="_blank" rel="noopener">Ресурси для валідаторів на GitHub</a> – посібники та матеріали</li>
    </ul>
  
    <blockquote>
    Екосистема величезна, але це не привід зупинятися. Щоб користуватися гаманцем, заробляти роботою чи спокійно стейкати, не треба знати все й одразу.
    </blockquote>
