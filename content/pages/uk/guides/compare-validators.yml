title: "Як обрати і оцінити валідаторів Solana"
lead: >
  Делегувати SOL – це насамперед вибір, кому довіряти. Цей посібник показує, як обрати валідатора: на що дивитися, крім гучного APY, і як [Validator Transparency Dashboard](../compare/) допомагає оцінити будь-якого валідатора mainnet за відкритими даними.
