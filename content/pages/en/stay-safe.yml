title: How to stay safe on Solana
lead: >-
  Most losses in crypto come from social engineering, not from broken blockchains. Slow down here –
  it pays off. If you are new to Solana, read [the basics](./basics.html) first.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>Your seed phrase is the master key</h2>
    <ul>
    <li>Never type it into a website, Telegram bot, or “support” form.</li>
    <li>Never screenshot it or store it in cloud notes.</li>
    <li>Legitimate apps will <em>never</em> ask you to paste it to “verify” or “sync” your wallet.</li>
    <li>If someone has your seed phrase, they own your funds – recovery is usually impossible.</li>
    </ul>
  
    <h2>Common scam patterns</h2>
    <ul>
    <li><strong>DMs promising free SOL or NFTs</strong> – especially on Discord, X, or Telegram.</li>
    <li><strong>Fake support</strong> – “we noticed unusual activity, connect your wallet here.”</li>
    <li><strong>Too-good APY</strong> – guaranteed high returns are a red flag; real staking yields change and carry risk.</li>
    <li><strong>Urgency</strong> – “act in 10 minutes or lose access.” Real tools do not pressure you like that.</li>
    <li><strong>Unknown apps</strong> – read what you sign; malicious transactions can drain approved tokens.</li>
    <li><strong>Fake jobs and bounties</strong> – DMs offering paid “content gigs” or airdrop tasks that ask you to connect a wallet or share a seed phrase. Real listings live on sites you open yourself (for Solana, that is often <a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a>).</li>
    </ul>
  
    <div class="callout callout-warn">
    <strong>Rule of thumb</strong><br />
    If you did not seek out the link yourself, treat it as hostile. Open official sites by typing the URL or using bookmarks you trust.
    </div>
  
    <h2>Verify before you trust</h2>
    <ul>
    <li>Cross-check validator or project names on multiple sources.</li>
    <li>Use explorers (e.g. Solscan, Solana Beach) to inspect addresses – not pretty landing pages alone.</li>
    <li>Assess validators with open tools – e.g. the <a href="./compare/">Validator Transparency</a> or our <a href="./compare-validators.html">assessment guide</a> – before delegating.</li>
    </ul>
  
    <h2>If something already went wrong</h2>
    <p>
    Mistakes happen to careful people too. What matters is the next ten minutes:
    </p>
    <ul>
    <li><strong>Shared your seed phrase?</strong> Create a brand-new wallet with a new phrase and move everything you can, immediately. The old wallet is compromised forever – never reuse that phrase.</li>
    <li><strong>Signed something suspicious?</strong> Move remaining funds to a fresh wallet, then review and revoke token approvals with a reputable tool before using the old address again.</li>
    <li><strong>Sent funds to a scammer?</strong> On-chain transfers are final – no support line can reverse them. Document what happened, warn the community where it occurred, and treat it as paid tuition.</li>
    <li><strong>Received strange tokens or NFTs?</strong> Just leave them. Interacting with unknown airdrops is how many drains start – ignoring them costs nothing.</li>
    </ul>
  
    <h2>Frequently asked questions</h2>
    <h3>What should I do if I shared my seed phrase?</h3>
    <p>
    Create a new wallet with a new seed phrase and move everything you can – the compromised wallet can be
    emptied at any moment. Never reuse the old phrase, even "temporarily."
    </p>
    <h3>How do I recognize a Solana scam?</h3>
    <p>
    Unsolicited DMs with free SOL, "support" asking to verify your wallet, guaranteed APY, countdown timers.
    Real tools never ask for your seed phrase and never rush you.
    </p>
    <h3>Is it safe to connect my wallet to a website?</h3>
    <p>
    Connecting is usually low-risk; the danger lives in what you <em>sign</em> afterwards. Only connect to
    sites you found yourself, read every transaction, and keep a separate small wallet for experiments.
    </p>
  
    <h2>What this guide will never do</h2>
    <p>
    We will not ask for your keys, promise returns, or tell you to stake today.
    Education first; actions are always your choice. New words tripping you up?
    The <a href="./glossary.html">Solana glossary</a> explains them all in one sentence each.
    </p>
