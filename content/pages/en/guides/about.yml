title: "About the Hub"
lead: >
  **Open Solana Hub** combines plain-English Solana education with the open [Validator Transparency Dashboard](./compare/). It is written for two audiences at once: people who are new to Solana and want to understand before they act, and delegators, researchers, and operators who want clear metrics without marketing noise.
