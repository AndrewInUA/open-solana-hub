section_title: What is Solana?
section_body: >
  Solana is public infrastructure for moving, holding, and using digital value –
  peer to peer, without a bank in the middle. Think of it as a shared ledger
  anyone can read, with rules enforced by code. That opens a layer of the
  internet where **you can own digital things directly** – money, art, tickets,
  identity – instead of renting access from a company.
