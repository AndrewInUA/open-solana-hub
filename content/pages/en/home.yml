hero_title: Solana in simple words and clear language
hero_lead: >
  We explain Solana in plain words: what the network is, how wallets work, and
  when staking comes into the picture. <a href="./compare/" target="_blank" rel="noopener noreferrer" data-new-tab="on">Validator Transparency</a>
  is the step before you stake: stability, commission, and voting history on every
  mainnet validator. <a href="./compare/mystake.html" target="_blank" rel="noopener noreferrer" data-new-tab="on">Stake health</a>
  then tracks the stake you already hold. <a href="./news/">Solana news</a> covers
  protocol upgrades, governance, client releases, and the community.
