title: About the Hub
lead: >-
  **Open Solana Hub** combines plain-English Solana education with the open [Validator Transparency
  Dashboard](./compare/). It is written for two audiences at once: people who are new to Solana and
  want to understand before they act, and delegators, researchers, and operators who want clear
  metrics without marketing noise.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>How the two parts fit together</h2>
    <p>
    The <strong>learning pages</strong> explain blockchain, wallets, safety, and staking without assuming
    a technical background. The <strong>Validator assessment</strong> section is the
    <a href="./compare/">Validator Transparency Dashboard</a>:
    all-time stability scores from daily full-network snapshots, commission history, voting consistency,
    and stake-pool splits for every mainnet validator. Education first, data when you need it –
    staking remains an optional last step, and the Hub never recommends a specific validator.
    </p>
  
    <h2>Who built it</h2>
    <p>
    I am <strong>Andrii</strong>, known in the Solana community as <a href="https://andrewinua.com/" target="_blank" rel="noopener">AndrewInUA</a>.
    I operate a Solana validator on mainnet and build open tools for delegators – not as a traditional software developer,
    but as someone who cares about transparency, clear language, and bridges between complex systems and everyday users.
    </p>
    <p>
    Before Solana I worked in journalism and communications. I joined the network in 2022 looking for resilient,
    meaningful infrastructure. The Hub is one way I pay that forward: explain first, let you explore, let you decide.
    </p>
  
    <h2>Related projects</h2>
    <ul>
    <li><a href="./compare-validators.html">How to assess validators</a> – guide to open metrics before you delegate</li>
    <li><a href="./compare/">Validator Transparency Dashboard</a> – browse and assess any mainnet validator</li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-metrics-html-widget" target="_blank" rel="noopener">Validator Metrics Widget</a> – embed live stats on your site</li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-resources" target="_blank" rel="noopener">Solana validator resources</a> – guides and assets</li>
    <li><a href="https://andrewinua.com/" target="_blank" rel="noopener">andrewinua.com</a> – validator home and delegation info</li>
    </ul>
  
    <h2>What this is not</h2>
    <p>
    Not financial advice, not a promise of returns, not a substitute for doing your own checks.
    When you are ready to assess validators, use open metrics; when you stake, you remain in control of your wallet.
    </p>
  
