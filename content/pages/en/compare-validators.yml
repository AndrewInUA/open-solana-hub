title: How to pick and assess Solana validators
lead: >-
  Delegating SOL is a trust decision. This guide explains how to pick a Solana validator – what to
  look at beyond a headline APY, and how the [Validator Transparency Dashboard](./compare/) helps
  you assess any mainnet validator with open data.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>Why APY alone is not enough</h2>
    <p>
    Yield changes with network conditions. A validator can also raise <strong>commission</strong> (their fee on your rewards),
    miss votes when the network is under load, or look fine today but show a weak long-term record.
    If you only sort by APY, you optimize for a number – not for behaviour over time.
    </p>
    <p>
    New to Solana? Start with <a href="./basics.html">what Solana and SOL are</a> and
    <a href="./stay-safe.html">how to stay safe</a> before you delegate anything meaningful.
    </p>
  
    <h2>Metrics that matter for transparency</h2>
    <ul>
    <li><strong>Commission</strong> – current fee and whether it changed in the past. A jump to 100% can wipe out your rewards.</li>
    <li><strong>Stability score</strong> – long-term consistency from daily full-network snapshots tracked in the dashboard.</li>
    <li><strong>Live voting status</strong> – is the validator healthy right now or delinquent?</li>
    <li><strong>Stake pool split</strong> – how much stake arrives via known pools versus direct wallet delegations (Trillium data).</li>
    <li><strong>APY context</strong> – useful when read next to commission and stability, not as the only filter.</li>
    </ul>
  
    <h2>Three ways to use the dashboard</h2>
    <ol>
    <li><strong>Browse the directory</strong> – search by name or vote key, sort by stake, open any validator profile.</li>
    <li><strong>Deep dive on one validator</strong> – read stability, commission history, epoch voting, and pool badges on a single page.</li>
    <li><strong>Compare two validators</strong> – use the on-page A vs B tool when you have narrowed your shortlist.</li>
    </ol>
  
    <h2>A simple workflow</h2>
    <ol>
    <li>Read <a href="./first-steps.html">first practical steps</a> if you still need a wallet or a small test transfer.</li>
    <li>Open the <a href="./compare/index.html#directory-section">validator directory</a> and pick a few names you have heard of – or search by vote key.</li>
    <li>Check commission and stability on each profile; note anything that looks inconsistent.</li>
    <li>If two validators look close, run a side-by-side compare on the same page.</li>
    <li>Delegate in your wallet only when you are comfortable – this guide does not recommend a specific validator.</li>
    </ol>
  
    <h2>Frequently asked questions</h2>
    <h3>How do I pick a Solana validator?</h3>
    <p>
    Pick a validator by checking commission and its history, long-term stability, live voting status, and
    pool versus direct stake – not by APY alone. Assess a short list on the same metrics, then delegate
    from your wallet when you are comfortable.
    </p>
    <h3>What should I check before delegating to a Solana validator?</h3>
    <p>
    Commission (current and history), long-term stability, live voting status, and how much stake comes
    from known pools versus direct delegations. APY alone is not enough.
    </p>
    <h3>Can I compare two Solana validators side by side?</h3>
    <p>
    Yes. On the <a href="./compare/">Validator Transparency Dashboard</a> you can open any validator and use
    the on-page compare tool to put a second validator next to it on the same metrics.
    </p>
  
    <blockquote>
    The Hub’s learning pages explain <em>why</em> staking exists; the dashboard shows <em>open data</em> so you can assess before you act.
    For a wider map of pools and rewards, see the <a href="./ecosystem.html">staking &amp; ecosystem overview</a>.
    </blockquote>
