title: Solana glossary – the terms, in simple words
lead: >-
  Every field has its dialect; crypto just speaks it louder. Here are the words you will actually
  meet on Solana – one plain sentence each, no lecture. Bookmark it, come back whenever a guide or a
  wallet says something strange.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>The basics</h2>
    <ul>
    <li><strong>Blockchain</strong> – a shared record book copied across thousands of computers; no single company owns it, and everyone can verify the rules.</li>
    <li><strong>Solana</strong> – a public blockchain built for fast, low-cost transactions; the network these guides are about.</li>
    <li><strong>SOL</strong> – Solana's native coin: it pays network fees and can optionally be staked.</li>
    <li><strong>Lamport</strong> – the smallest unit of SOL, like a cent to a dollar; 1 SOL = 1&nbsp;billion lamports.</li>
    <li><strong>Transaction</strong> – any action recorded on the network: a transfer, a swap, a stake delegation.</li>
    <li><strong>Fee</strong> – the small amount of SOL a transaction costs; on Solana usually a fraction of a cent.</li>
    <li><strong>Address</strong> – your public "account number" on Solana; safe to share, unlike your keys.</li>
    <li><strong>Explorer</strong> – a public website (Solscan, Solana FM) where anyone can look up transactions, addresses, and validators.</li>
    <li><strong>Epoch</strong> – Solana's calendar unit, roughly 2–3 days; staking changes and rewards happen on epoch boundaries.</li>
    <li><strong>Mainnet</strong> – the real network with real value, as opposed to test networks used for practice.</li>
    <li><strong>Devnet / testnet</strong> – practice networks where coins have no value; developers and curious people break things here safely.</li>
    </ul>
  
    <h2>Wallets and security</h2>
    <ul>
    <li><strong>Wallet</strong> – software or a device that holds your keys and lets you approve transactions; Phantom, Solflare, and Backpack are popular on Solana.</li>
    <li><strong>Seed phrase</strong> – the 12–24 words that back up your wallet; whoever knows them controls your funds, forever, no appeals.</li>
    <li><strong>Private key</strong> – the secret code that signs your transactions; your seed phrase can regenerate it, which is why both must stay secret.</li>
    <li><strong>Public key</strong> – the shareable half of the pair; your address is derived from it.</li>
    <li><strong>Hardware wallet</strong> – a physical device (Ledger and similar) that keeps keys offline; strong protection for meaningful amounts.</li>
    <li><strong>Signing</strong> – approving a transaction with your key; read what you sign, because a signature is consent.</li>
    <li><strong>Phishing</strong> – fake sites, messages, or "support" designed to trick you into revealing keys or signing something harmful.</li>
    <li><strong>Drainer</strong> – a malicious transaction or app that empties a wallet once you approve it; the reason "read what you sign" is rule one.</li>
    <li><strong>Self-custody</strong> – holding your own keys instead of trusting an exchange; more freedom, more responsibility.</li>
    </ul>
  
    <h2>Staking and validators</h2>
    <ul>
    <li><strong>Staking</strong> – locking SOL to support the network's security and earn a share of rewards; on Solana it is optional and reversible.</li>
    <li><strong>Delegation</strong> – pointing your staked SOL at a validator you choose; the SOL never leaves your wallet.</li>
    <li><strong>Validator</strong> – an operator running servers that confirm transactions and vote on the state of the network; when you stake, you pick one to back.</li>
    <li><strong>Vote account</strong> – a validator's public identity for voting and receiving delegations; the long key you can search on Validator Transparency.</li>
    <li><strong>Commission</strong> – the percentage of rewards a validator keeps for running the infrastructure; check its history, not just today's number.</li>
    <li><strong>Stake account</strong> – the on-chain account that holds your delegated SOL; created automatically by your wallet when you stake.</li>
    <li><strong>Undelegate / deactivate</strong> – the way out of staking: you request it, then wait until the epoch ends for the SOL to become liquid.</li>
    <li><strong>Rewards</strong> – the extra SOL staking earns, paid every epoch; the amount varies with the network, so treat any fixed promise with suspicion.</li>
    <li><strong>APY</strong> – annualized yield estimate; useful as context, misleading as the only filter for choosing a validator.</li>
    <li><strong>Inflation</strong> – the scheduled issuance of new SOL that funds staking rewards; it declines over time by design.</li>
    <li><strong>Delinquent</strong> – a validator that has stopped voting; delegating to one earns nothing until it recovers.</li>
    <li><strong>Native staking</strong> – delegating from your own wallet to a validator you choose; maximum control, and this Hub's main subject.</li>
    <li><strong>Liquid staking</strong> – depositing SOL into a pool that stakes for you and gives you a liquid token in return; convenient, adds pool fees and smart-contract risk.</li>
    <li><strong>Stake pool</strong> – a service (Marinade, Jito, and others) that spreads deposited SOL across many validators.</li>
    <li><strong>LST</strong> – "liquid staking token" (mSOL, JitoSOL) – the receipt token a pool gives you, tradable while the underlying SOL is staked.</li>
    <li><strong>MEV</strong> – "maximal extractable value" – extra income validators can earn from transaction ordering; on Solana often via Jito; a detail worth knowing, not fearing.</li>
    </ul>
  
    <h2>Ecosystem and slang</h2>
    <ul>
    <li><strong>dApp</strong> – a "decentralized application" – an app that runs against the blockchain and connects to your wallet instead of a login.</li>
    <li><strong>DeFi</strong> – financial apps (swaps, lending) built on public networks; powerful, and a place to walk slowly.</li>
    <li><strong>NFT</strong> – a unique on-chain record used for art, memberships, or game items; ownership is verifiable, value is not guaranteed.</li>
    <li><strong>Token</strong> – any asset issued on the network besides SOL itself; some are useful, some are jokes, few are investments.</li>
    <li><strong>Airdrop</strong> – free tokens sent to wallets, sometimes real marketing, often scam bait; unexpected tokens are best left untouched.</li>
    <li><strong>Bounty</strong> – a paid task posted by a project (writing, design, code); Superteam Earn is the main Solana board. Pay is for work delivered, not a staking yield.</li>
    <li><strong>RPC</strong> – the connection point apps use to talk to the network; when a wallet "can't connect," it is usually an RPC hiccup, not lost funds.</li>
    <li><strong>DYOR</strong> – "do your own research" – the house rule of this entire site.</li>
    </ul>
  
    <h2>Frequently asked questions</h2>
    <h3>What is an epoch on Solana?</h3>
    <p>
    An epoch is Solana's internal calendar unit, roughly 2–3 days long. Staking changes – delegating,
    undelegating, commission updates – take effect at epoch boundaries, and rewards are paid once per epoch.
    </p>
    <h3>What is validator commission?</h3>
    <p>
    The percentage a validator keeps from staking rewards. A 5% commission means 95% of rewards reach
    delegators. History matters more than the current number – our
    <a href="./compare-validators.html">assessment guide</a> explains why.
    </p>
    <h3>What is the difference between native and liquid staking?</h3>
    <p>
    Native staking: you delegate from your own wallet to a validator you choose, and the SOL stays under
    your control. Liquid staking: you deposit into a pool, it spreads the stake across validators, and you
    hold a liquid token (mSOL, JitoSOL) instead. More on both in the
    <a href="./ecosystem.html">ecosystem overview</a>.
    </p>
  
    <blockquote>
    A term you keep forgetting is not a personal failure – it is a bookmark waiting to happen.
    When you are ready to use these words in practice, start with <a href="./basics.html">the basics</a>
    or go straight to <a href="./first-steps.html">first practical steps</a>.
    </blockquote>
