title: Solana ecosystem overview
lead: >-
  Staking is one path. You can also get paid for work, or use apps and tokens. This page maps the
  options first, then the details.
page_image: ""
page_image_alt: ""
page_image_caption: ""
body: |
  <h2>What you can do here</h2>
    <p>
    Solana is not only staking. Most people start with one of these – pick the path that matches why you came:
    </p>
    <ul>
    <li><strong><a href="#earn">Earn by doing work</a></strong> – writing, design, translation, community, or code. Paid listings from Solana projects, not a staking yield.</li>
    <li><strong><a href="#stake">Stake SOL</a></strong> – delegate to a validator and share network rewards. Optional, reversible, and this Hub's deepest coverage.</li>
    <li><strong><a href="#apps">Use apps and tokens</a></strong> – payments, markets, NFTs. A wallet is enough to start; not everything is an investment.</li>
    </ul>
  
    <h2 id="earn">How to earn beyond staking</h2>
    <p>
    If you are new, the first question is often how to earn. Staking is one answer; paid work is another.
    A large slice of the Solana ecosystem is people doing writing, design, translation, community, and
    code for projects. You do not need to be a developer to show up.
    </p>
    <p>
    <a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a> is the main
    Solana-native board for that work – bounties, freelance gigs, and grants posted by projects in the
    ecosystem. You make a profile, pick a listing, submit the work, and get paid in crypto if the sponsor
    accepts it. That is a job board, not a staking yield and not a promised income.
    </p>
    <ul>
    <li><strong>What it is</strong> – open listings from Solana teams, paid in crypto when the work is accepted.</li>
    <li><strong>Who it is for</strong> – writers, designers, translators, community people, and developers. Many tasks need no code.</li>
    <li><strong>What it is not</strong> – passive yield, airdrop farming, or a shortcut around learning wallets and safety.</li>
    </ul>
    <p>
    Bookmark the official URL yourself. Fake “bounty” or “paid gig” DMs are a common scam – open listings
    you found, read what you sign, and keep the habits in <a href="./stay-safe.html">stay safe</a>.
    </p>
  
    <h2 id="apps">Apps and tokens</h2>
    <p>
    Thousands of apps live on Solana – payments, games, marketplaces, DeFi. Most require a wallet connection.
    Tokens are assets on the network; some represent projects, some are memes, some are useful. Not all are investments.
    </p>
  
    <h2>NFTs and digital ownership</h2>
    <p>
    NFTs are unique on-chain records – often used for art, memberships, or game items. Ownership is verifiable;
    value is social and market-driven, not guaranteed.
    </p>
  
    <h2 id="stake">Where to stake SOL</h2>
    <p>
    Most people stake in one of two ways: <strong>native delegation</strong> from a wallet (you pick the validator),
    or through a <strong>liquid staking pool</strong> (the pool picks validators for you).
    Either way, read commission and history before you commit – our
    <a href="./compare-validators.html">validator assessment guide</a> and
    <a href="./first-steps.html">how to stake SOL guide</a> walk through the steps.
    </p>
  
    <h2>Validators and staking</h2>
    <p>
    Validators run software that helps Solana reach agreement on transactions. When you stake, you delegate SOL to a validator
    you trust; they earn voting credits, and you may receive a share of inflation rewards minus their commission.
    </p>
    <ul>
    <li><strong>Native staking</strong> – delegate from your wallet to a vote account.</li>
    <li><strong>Liquid staking / pools</strong> – stake through a pool (Marinade, Jito, etc.); the pool picks validators.</li>
    <li><strong>Assess before you delegate</strong> – use the <a href="./compare/">Validator Transparency Dashboard</a> or read <a href="./compare-validators.html">how to assess validators</a> first.</li>
    </ul>
  
    <h2>How staking rewards work (no hype)</h2>
    <p>
    Staking can earn a share of network inflation rewards, minus validator commission (and pool fees if you use a pool).
    Yields change with network conditions – nobody can promise a fixed “earn on Solana” rate.
    Rewards are not guaranteed; <a href="./stay-safe.html">understanding risk</a> comes before chasing yield.
    </p>
  
    <h2>Native staking vs liquid staking – quick comparison</h2>
    <ul>
    <li><strong>Control</strong> – native: you pick the validator; liquid: the pool picks for you.</li>
    <li><strong>Custody</strong> – native: SOL stays in your own stake account; liquid: SOL sits in the pool's smart contract, you hold a receipt token (mSOL, JitoSOL).</li>
    <li><strong>Liquidity</strong> – native: undelegating takes until the end of the epoch; liquid: the token is tradable right away.</li>
    <li><strong>Fees</strong> – native: validator commission only; liquid: commission plus the pool's own fee.</li>
    <li><strong>Extra risk</strong> – native: picking a poor validator; liquid: smart-contract risk and the token's market price.</li>
    </ul>
    <p>
    Neither is "better" – they answer different needs. If you want to understand and choose,
    go native and <a href="./compare-validators.html">assess validators</a> first. If you want
    set-and-forget, a reputable pool is a fair trade.
    </p>
  
    <h2>Frequently asked questions</h2>
    <h3>Can I earn SOL without being a developer?</h3>
    <p>
    Yes, if you mean paid work rather than staking. Superteam Earn lists writing, design, translation,
    and other tasks from Solana projects. Pay is for completed work, not a yield, and you still need a
    wallet plus the habits in <a href="./stay-safe.html">stay safe</a>.
    </p>
    <h3>Where is the best place to stake SOL?</h3>
    <p>
    There is no single best place – it depends on how much control you want. Native delegation gives you
    full choice and custody; liquid pools are hands-off but add fees and smart-contract risk. Either way,
    look at open data first – that is what the <a href="./compare/">dashboard</a> is for.
    </p>
    <h3>Can I lose my SOL if my validator fails?</h3>
    <p>
    With native staking, a failing validator costs you missed rewards, not your principal – Solana currently
    has no slashing of delegated stake. The real dangers are <a href="./stay-safe.html">scams and key
    management</a>, not downtime.
    </p>
    <h3>What is liquid staking on Solana?</h3>
    <p>
    Depositing SOL into a pool that delegates across many validators and hands you a tradable token
    (mSOL, JitoSOL) in return. Liquidity now, pool fees and smart-contract risk as the price.
    Unsure about a term? Check the <a href="./glossary.html">glossary</a>.
    </p>
  
    <h2>Where to learn more (official-ish)</h2>
    <ul>
    <li><a href="https://solana.com/docs" target="_blank" rel="noopener">Solana documentation</a></li>
    <li><a href="https://solana.com/docs/intro/quick-start" target="_blank" rel="noopener">Solana quick start (Playground)</a></li>
    <li><a href="https://superteam.fun/earn" target="_blank" rel="noopener">Superteam Earn</a> – bounties and gigs from Solana projects</li>
    <li><a href="https://github.com/AndrewInUA/solana-validator-resources" target="_blank" rel="noopener">Validator resources on GitHub</a> – guides and assets</li>
    </ul>
  
    <blockquote>
    The ecosystem is large. You do not need to understand all of it to use a wallet, get paid for work, or stake thoughtfully.
    </blockquote>
